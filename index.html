<!DOCTYPE html>
<html lang="en">
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Shoe AR</title>
  <script type="module" src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0c0c0e;
      --border: rgba(255,255,255,0.08);
      --accent: #e8d5b0;
      --muted: #555;
      --pill: rgba(255,255,255,0.06);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: var(--bg);
      font-family: 'Syne', sans-serif;
      color: #f0ede8;
      height: 100dvh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    model-viewer {
      width: 100%; flex: 1;
      --poster-color: transparent;
      background: radial-gradient(ellipse at 50% 35%, #3d3d3d 0%, #282828 45%, #1a1a1a 100%);
    }
    body.env-sunset model-viewer { background: radial-gradient(ellipse at 50% 30%, #2d1a0e 0%, #1a0a18 50%, #0c0c0e 100%); }
    body.env-arctic model-viewer { background: radial-gradient(ellipse at 50% 30%, #0d1f2d 0%, #071318 60%, #0c0c0e 100%); }
    body.env-forest model-viewer { background: radial-gradient(ellipse at 50% 30%, #0d1f0e 0%, #071008 60%, #0c0c0e 100%); }

    model-viewer::part(default-progress-bar) { display: none; }
    model-viewer canvas { display: block; }

    /* ── DYNAMIC SHADOW ─────────────────────────────────────────── */
    .shadow-overlay {
      position: fixed;
      left: 50%;
      /* JS will update translateX(-50%) + dynamic offset */
      bottom: 200px;
      width: 340px;
      height: 80px;
      background: radial-gradient(ellipse at 50% 80%,
        rgba(0,0,0,0.55) 0%,
        rgba(0,0,0,0.25) 40%,
        transparent 75%
      );
      border-radius: 50%;
      pointer-events: none;
      z-index: 10;
      filter: blur(8px);
      /* smooth transition so shadow doesn't snap */
      transition: transform 0.12s ease-out, bottom 0.12s ease-out, width 0.12s ease-out, opacity 0.3s;
      transform: translateX(-50%) scaleX(1) scaleY(1);
      transform-origin: center bottom;
    }

    /* ── LOADER ─────────────────────────────────────────────────── */
    #loader {
      position: fixed; inset: 0;
      background: var(--bg); z-index: 9999;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 20px;
      transition: opacity 0.5s, visibility 0.5s;
    }
    #loader.hidden { opacity: 0; visibility: hidden; }
    .loader-bar-wrap { width: 160px; height: 2px; background: rgba(255,255,255,0.1); border-radius: 2px; overflow: hidden; }
    .loader-bar { height: 100%; width: 0%; background: var(--accent); border-radius: 2px; transition: width 0.3s ease; }
    .loader-text { font-size: 11px; letter-spacing: 3px; text-transform: uppercase; color: var(--muted); }

    /* ── SHOE SELECTOR (top strip) ──────────────────────────────── */
    #shoe-selector {
      position: fixed; top: 0; left: 0; right: 0; z-index: 200;
      display: flex; gap: 10px; align-items: center;
      padding: 12px 16px 10px;
      background: linear-gradient(to bottom, rgba(12,12,14,0.95) 70%, transparent);
      overflow-x: auto; -webkit-overflow-scrolling: touch; scrollbar-width: none;
    }
    #shoe-selector::-webkit-scrollbar { display: none; }

    .shoe-card {
      flex: 0 0 auto;
      width: 68px;
      background: var(--pill);
      border: 1.5px solid var(--border);
      border-radius: 14px;
      padding: 6px;
      cursor: pointer;
      transition: border-color 0.2s, transform 0.15s, background 0.2s;
      text-align: center;
      -webkit-tap-highlight-color: transparent;
    }
    .shoe-card.active {
      border-color: var(--accent);
      background: rgba(232,213,176,0.08);
      transform: scale(1.05);
    }
    .shoe-card .thumb {
      width: 100%; aspect-ratio: 1;
      border-radius: 9px;
      background: rgba(255,255,255,0.04);
      display: flex; align-items: center; justify-content: center;
      font-size: 26px;
      margin-bottom: 4px;
      overflow: hidden;
    }
    .shoe-card .thumb img {
      width: 100%; height: 100%; object-fit: cover; border-radius: 9px;
    }
    .shoe-card .shoe-name {
      font-size: 8px; letter-spacing: 0.5px; text-transform: uppercase;
      color: var(--muted); line-height: 1.2;
    }
    .shoe-card.active .shoe-name { color: var(--accent); }

    /* ── BOTTOM ─────────────────────────────────────────────────── */
    .bottom {
      position: fixed; bottom: 0; left: 0; right: 0; z-index: 100;
      background: linear-gradient(to top, rgba(12,12,14,1) 55%, transparent);
      padding: 10px 20px 36px;
    }

    .shoe-title-row {
      display: flex; align-items: baseline; justify-content: space-between;
      margin-bottom: 8px;
    }
    #shoe-display-name {
      font-size: 16px; font-weight: 800; letter-spacing: 0.5px;
      transition: opacity 0.2s;
    }
    #shoe-display-brand {
      font-size: 10px; letter-spacing: 2px; text-transform: uppercase; color: var(--muted);
    }

    .tabs { display: flex; gap: 4px; margin-bottom: 10px; border-bottom: 1px solid var(--border); }
    .tab {
      font-size: 11px; letter-spacing: 1.5px; text-transform: uppercase;
      padding: 6px 12px; color: var(--muted); cursor: pointer;
      border: none; border-bottom: 2px solid transparent; margin-bottom: -1px;
      background: none; font-family: 'Syne', sans-serif;
      transition: color 0.2s, border-color 0.2s;
    }
    .tab.active { color: var(--accent); border-bottom-color: var(--accent); }

    .panel { display: none; padding: 8px 0; }
    .panel.active { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }

    .swatch { width: 30px; height: 30px; border-radius: 50%; cursor: pointer; border: 2px solid transparent; transition: transform 0.15s, border-color 0.15s; }
    .swatch.active { border-color: var(--accent); transform: scale(1.15); }

    .size-btn {
      width: 46px; height: 36px; border: 1px solid var(--border);
      background: var(--pill); color: #f0ede8; border-radius: 8px;
      font-size: 12px; font-family: 'Syne', sans-serif; cursor: pointer; transition: all 0.15s;
    }
    .size-btn.active { background: var(--accent); color: #000; border-color: var(--accent); font-weight: 700; }
    .size-btn.sold-out { opacity: 0.25; text-decoration: line-through; cursor: not-allowed; }

    .env-btn {
      padding: 6px 14px; border-radius: 20px; font-size: 11px; letter-spacing: 1px;
      text-transform: uppercase; border: 1px solid var(--border); background: var(--pill);
      color: var(--muted); cursor: pointer; font-family: 'Syne', sans-serif; transition: all 0.2s;
    }
    .env-btn.active { background: var(--accent); color: #000; border-color: var(--accent); font-weight: 700; }

    .action-row { display: flex; gap: 10px; margin-top: 12px; }

    #ar-btn {
      flex: 1; background: var(--accent); color: #000; border: none; border-radius: 12px;
      padding: 15px; font-size: 14px; font-weight: 800; font-family: 'Syne', sans-serif;
      letter-spacing: 1px; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px;
      -webkit-tap-highlight-color: transparent;
    }

    #tryon-btn {
      background: var(--pill); color: #f0ede8; border: 1px solid var(--border);
      border-radius: 12px; padding: 15px 18px; font-size: 14px; font-weight: 700;
      font-family: 'Syne', sans-serif; cursor: pointer;
      display: flex; align-items: center; gap: 6px;
      -webkit-tap-highlight-color: transparent; white-space: nowrap;
      transition: background 0.2s, border-color 0.2s;
    }
    #tryon-btn:active { background: rgba(255,255,255,0.12); }

    .hint {
      position: fixed; bottom: 210px; left: 50%; transform: translateX(-50%);
      font-size: 11px; color: var(--muted); letter-spacing: 1px; text-transform: uppercase;
      animation: pulse 2.5s ease-in-out infinite; pointer-events: none; white-space: nowrap; z-index: 99;
    }
    @keyframes pulse { 0%,100%{opacity:0.3} 50%{opacity:0.8} }

    #toast {
      position: fixed; top: 20px; left: 50%; transform: translateX(-50%) translateY(-8px);
      background: var(--accent); color: #000; padding: 7px 18px; border-radius: 20px;
      font-size: 12px; font-weight: 700; letter-spacing: 1px;
      z-index: 9999; opacity: 0; transition: opacity 0.3s, transform 0.3s; pointer-events: none;
    }
    #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  </style>
</head>
<body>

  <div id="loader">
    <div class="loader-bar-wrap"><div class="loader-bar" id="loader-bar"></div></div>
    <div class="loader-text">Loading…</div>
  </div>

  <div id="toast"></div>

  <!-- ── SHOE SELECTOR ───────────────────────────────────────── -->
  <div id="shoe-selector">
    <!-- Cards injected by JS from SHOE_CATALOG -->
  </div>

  <model-viewer id="viewer" src="shoe.glb" ar ar-modes="webxr scene-viewer quick-look"
    ar-scale="auto" ar-placement="floor" camera-controls auto-rotate auto-rotate-delay="1000"
    rotation-per-second="15deg" shadow-intensity="0" shadow-softness="1" exposure="0.8"
    tone-mapping="commerce"
    environment-image="https://modelviewer.dev/shared-assets/environments/aircraft_workshop_01_1k.hdr"
    alt="Shoe">
  </model-viewer>

  <!-- Dynamic shadow div — JS moves this in sync with camera -->
  <div class="shadow-overlay" id="shadow"></div>

  <div class="hint">Drag to rotate · Pinch to zoom</div>

  <div class="bottom">
    <div class="shoe-title-row">
      <span id="shoe-display-name">Nike Quest 16</span>
      <span id="shoe-display-brand">Nike</span>
    </div>

    <div class="tabs">
      <button class="tab active" data-tab="colors">Colors</button>
      <button class="tab" data-tab="sizes">Sizes</button>
      <button class="tab" data-tab="scene">Scene</button>
    </div>

    <div class="panel active" id="tab-colors">
      <div class="swatch active" style="background:#d4b8a8" data-label="Rose" onclick="selectSwatch(this)"></div>
      <div class="swatch" style="background:#1a1a2e" data-label="Navy" onclick="selectSwatch(this)"></div>
      <div class="swatch" style="background:#2d4a1e" data-label="Forest" onclick="selectSwatch(this)"></div>
      <div class="swatch" style="background:#8b1a1a" data-label="Crimson" onclick="selectSwatch(this)"></div>
      <div class="swatch" style="background:#e8e8e0" data-label="White" onclick="selectSwatch(this)"></div>
    </div>

    <div class="panel" id="tab-sizes">
      <button class="size-btn sold-out">UK 5</button>
      <button class="size-btn" onclick="selectSize(this)">UK 6</button>
      <button class="size-btn" onclick="selectSize(this)">UK 7</button>
      <button class="size-btn active" onclick="selectSize(this)">UK 8</button>
      <button class="size-btn" onclick="selectSize(this)">UK 9</button>
      <button class="size-btn" onclick="selectSize(this)">UK 10</button>
      <button class="size-btn sold-out">UK 11</button>
    </div>

    <div class="panel" id="tab-scene">
      <button class="env-btn active" onclick="setEnv(this,'','neutral')">Studio</button>
      <button class="env-btn" onclick="setEnv(this,'env-sunset','legacy')">Sunset</button>
      <button class="env-btn" onclick="setEnv(this,'env-arctic','spruit')">Arctic</button>
      <button class="env-btn" onclick="setEnv(this,'env-forest','neutral')">Forest</button>
    </div>

    <div class="action-row">
      <button id="ar-btn" onclick="document.getElementById('viewer').activateAR()">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M3 7V5a2 2 0 0 1 2-2h2"/><path d="M17 3h2a2 2 0 0 1 2 2v2"/>
          <path d="M21 17v2a2 2 0 0 1-2 2h-2"/><path d="M7 21H5a2 2 0 0 1-2-2v-2"/>
          <circle cx="12" cy="12" r="3"/>
        </svg>
        View in AR
      </button>
      <button id="tryon-btn" onclick="window.location.href='tryon.html'">
        👟 Try-On
      </button>
    </div>
  </div>

  <script>
    /* ═══════════════════════════════════════════════════════════
       SHOE CATALOG — add new shoes here, that's it!
       
       Fields:
         id       : unique string key
         name     : display name shown at bottom
         brand    : brand label
         src      : path to .glb file
         thumb    : path to thumbnail image OR emoji fallback
         colors   : array of {hex, label} — leave empty [] to keep defaults
         sizes    : array of size strings, prefix with '!' to mark sold-out
                    e.g. ['!UK 5', 'UK 6', 'UK 7']
    ═══════════════════════════════════════════════════════════ */
    const SHOE_CATALOG = [
      {
        id: 'quest16',
        name: 'Quest 16',
        brand: 'Nike',
        src: 'shoe.glb',
        thumb: '👟',   // replace with 'thumb-quest16.jpg' once you have images
        colors: [
          { hex: '#d4b8a8', label: 'Rose' },
          { hex: '#1a1a2e', label: 'Navy' },
          { hex: '#2d4a1e', label: 'Forest' },
          { hex: '#8b1a1a', label: 'Crimson' },
          { hex: '#e8e8e0', label: 'White' },
        ],
        sizes: ['!UK 5','UK 6','UK 7','UK 8','UK 9','UK 10','!UK 11'],
      },

      /* ── ADD MORE SHOES BELOW THIS LINE ──────────────────────
         Just copy the block above and change the values.
         Example:

      {
        id: 'airmax90',
        name: 'Air Max 90',
        brand: 'Nike',
        src: 'airmax90.glb',
        thumb: 'thumbs/airmax90.jpg',
        colors: [
          { hex: '#f5f5f5', label: 'White' },
          { hex: '#111', label: 'Black' },
        ],
        sizes: ['UK 6','UK 7','UK 8','UK 9','UK 10'],
      },

      {
        id: 'ultraboost',
        name: 'Ultraboost 24',
        brand: 'Adidas',
        src: 'ultraboost.glb',
        thumb: 'thumbs/ultraboost.jpg',
        colors: [{ hex: '#000', label: 'Core Black' }],
        sizes: ['UK 7','UK 8','UK 9','!UK 10'],
      },
      ─────────────────────────────────────────────────────── */
    ];

    /* ─────────────── INTERNALS — no need to edit below ─────── */
    const viewer     = document.getElementById('viewer');
    const loaderBar  = document.getElementById('loader-bar');
    const loader     = document.getElementById('loader');
    const shadow     = document.getElementById('shadow');
    const selectorEl = document.getElementById('shoe-selector');

    let currentShoeId = SHOE_CATALOG[0].id;

    /* ── Build shoe selector cards ── */
    function buildSelector() {
      selectorEl.innerHTML = '';
      SHOE_CATALOG.forEach(shoe => {
        const card = document.createElement('div');
        card.className = 'shoe-card' + (shoe.id === currentShoeId ? ' active' : '');
        card.dataset.id = shoe.id;

        const thumb = document.createElement('div');
        thumb.className = 'thumb';
        if (shoe.thumb && !shoe.thumb.startsWith('http') && shoe.thumb.match(/\.(jpg|jpeg|png|webp)/i)) {
          const img = document.createElement('img');
          img.src = shoe.thumb; img.alt = shoe.name;
          thumb.appendChild(img);
        } else {
          thumb.textContent = shoe.thumb || '👟';
        }

        const label = document.createElement('div');
        label.className = 'shoe-name';
        label.textContent = shoe.name;

        card.appendChild(thumb);
        card.appendChild(label);
        card.addEventListener('click', () => selectShoe(shoe.id));
        selectorEl.appendChild(card);
      });
    }

    /* ── Switch shoe ── */
    function selectShoe(id) {
      const shoe = SHOE_CATALOG.find(s => s.id === id);
      if (!shoe || id === currentShoeId) return;
      currentShoeId = id;

      // Update active card
      document.querySelectorAll('.shoe-card').forEach(c =>
        c.classList.toggle('active', c.dataset.id === id));

      // Fade name
      const nameEl = document.getElementById('shoe-display-name');
      const brandEl = document.getElementById('shoe-display-brand');
      nameEl.style.opacity = '0';
      setTimeout(() => {
        nameEl.textContent = shoe.name;
        brandEl.textContent = shoe.brand;
        nameEl.style.opacity = '1';
      }, 150);

      // Swap model
      viewer.src = shoe.src;

      // Rebuild colors panel
      const colorsPanel = document.getElementById('tab-colors');
      if (shoe.colors && shoe.colors.length) {
        colorsPanel.innerHTML = '';
        shoe.colors.forEach((c, i) => {
          const sw = document.createElement('div');
          sw.className = 'swatch' + (i === 0 ? ' active' : '');
          sw.style.background = c.hex;
          sw.dataset.label = c.label;
          sw.onclick = function() { selectSwatch(this); };
          colorsPanel.appendChild(sw);
        });
      }

      // Rebuild sizes panel
      const sizesPanel = document.getElementById('tab-sizes');
      if (shoe.sizes && shoe.sizes.length) {
        sizesPanel.innerHTML = '';
        shoe.sizes.forEach((s, i) => {
          const soldOut = s.startsWith('!');
          const label = soldOut ? s.slice(1) : s;
          const btn = document.createElement('button');
          btn.className = 'size-btn' + (soldOut ? ' sold-out' : '') + (i === 3 && !soldOut ? ' active' : '');
          btn.textContent = label;
          if (!soldOut) btn.onclick = function() { selectSize(this); };
          sizesPanel.appendChild(btn);
        });
      }

      showToast(shoe.name);
    }

    /* ── Loader animation ── */
    let prog = 0;
    const ti = setInterval(() => {
      prog += Math.random() * 20;
      if (prog > 90) { prog = 90; clearInterval(ti); }
      loaderBar.style.width = prog + '%';
    }, 200);

    viewer.addEventListener('load', () => {
      clearInterval(ti);
      loaderBar.style.width = '100%';
      setTimeout(() => loader.classList.add('hidden'), 400);
      viewer.style.setProperty('--ground-shadow', 'none');
      startShadowTracking();
    });

    /* ── Dynamic shadow ─────────────────────────────────────────
       Strategy: read camera orbit angles from model-viewer and
       shift / squish the shadow to simulate a real cast shadow.
       
       - Theta (horizontal orbit) → shifts shadow left/right
       - Phi (vertical orbit / tilt) → scales shadow narrow when
         camera is overhead, wide when camera is at shoe level
       - When user drags, shadow transitions smoothly (CSS ease)
    ─────────────────────────────────────────────────────────── */
    function startShadowTracking() {
      function updateShadow() {
        try {
          const orbit = viewer.getCameraOrbit();
          // orbit.theta = horizontal angle (radians), orbit.phi = vertical (radians)
          const theta = orbit.theta; // rotation around Y axis
          const phi   = orbit.phi;  // 0 = overhead, π/2 = eye-level

          // Horizontal offset: shoe shadow shifts opposite to camera position
          // At full rotation the shadow shifts ±30px
          const offsetX = Math.sin(theta) * -28;

          // Vertical scale: when camera is overhead (phi ≈ 0) shadow is round (scaleX wide)
          // When camera is at eye level (phi ≈ π/2) shadow is narrow
          const tiltFactor = Math.sin(phi); // 0 at overhead → 1 at eye-level
          const scaleX = 0.6 + tiltFactor * 0.5;   // 0.6 → 1.1
          const scaleY = 0.8 + tiltFactor * 0.3;   // 0.8 → 1.1
          const opacity = 0.5 + tiltFactor * 0.35; // darker when more side-on

          shadow.style.transform = `translateX(calc(-50% + ${offsetX.toFixed(1)}px)) scaleX(${scaleX.toFixed(3)}) scaleY(${scaleY.toFixed(3)})`;
          shadow.style.opacity = opacity.toFixed(3);
        } catch(e) {
          // model-viewer not ready yet
        }
      }

      // Update on every camera-change event (fires during drag & auto-rotate)
      viewer.addEventListener('camera-change', updateShadow);
      // Also tick for auto-rotate when no drag event fires
      setInterval(updateShadow, 50);
      updateShadow();
    }

    /* ── Tabs ── */
    document.querySelectorAll('.tab').forEach(tab => {
      tab.addEventListener('click', () => {
        document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
        document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
        tab.classList.add('active');
        document.getElementById('tab-' + tab.dataset.tab).classList.add('active');
      });
    });

    function selectSwatch(el) {
      document.querySelectorAll('.swatch').forEach(s => s.classList.remove('active'));
      el.classList.add('active'); showToast(el.dataset.label);
    }
    function selectSize(el) {
      if (el.classList.contains('sold-out')) return;
      document.querySelectorAll('.size-btn').forEach(b => b.classList.remove('active'));
      el.classList.add('active'); showToast(el.textContent);
    }

    const hdrs = {
      neutral: 'https://modelviewer.dev/shared-assets/environments/neutral.hdr',
      legacy:  'https://modelviewer.dev/shared-assets/environments/legacy.hdr',
      spruit:  'https://modelviewer.dev/shared-assets/environments/spruit_sunrise_1k_HDR.hdr'
    };
    function setEnv(el, cls, hdr) {
      document.querySelectorAll('.env-btn').forEach(b => b.classList.remove('active'));
      el.classList.add('active'); document.body.className = cls;
      viewer.environmentImage = hdrs[hdr]; showToast(el.textContent);
    }

    function showToast(msg) {
      const t = document.getElementById('toast');
      t.textContent = msg; t.classList.add('show');
      setTimeout(() => t.classList.remove('show'), 1600);
    }

    /* ── Init ── */
    buildSelector();
    // Set initial name from first shoe
    const first = SHOE_CATALOG[0];
    document.getElementById('shoe-display-name').textContent = first.name;
    document.getElementById('shoe-display-brand').textContent = first.brand;
  </script>
</body>
</html>
