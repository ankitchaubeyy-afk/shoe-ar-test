<!DOCTYPE html>
<html lang="en">
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Shoe Try-On</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: #000;
    font-family: 'Segoe UI', sans-serif;
    overflow: hidden;
    height: 100dvh;
    touch-action: none;
  }

  #ar-container {
    position: relative;
    width: 100vw;
    height: 100dvh;
  }

  /* DeepAR renders into this canvas */
  #deepar-canvas {
    position: absolute;
    inset: 0;
    width: 100% !important;
    height: 100% !important;
    object-fit: cover;
  }

  /* ── Loader ── */
  #loader {
    position: fixed;
    inset: 0;
    background: #0a0a0a;
    z-index: 999;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 16px;
    transition: opacity 0.5s;
  }
  #loader.hidden { opacity: 0; pointer-events: none; }

  .ld-logo {
    font-size: 40px;
    margin-bottom: 4px;
  }
  .ld-title {
    color: #e8d5b0;
    font-size: 15px;
    letter-spacing: 5px;
    font-weight: 700;
    text-transform: uppercase;
  }
  .ld-bar-wrap {
    width: 200px;
    height: 2px;
    background: rgba(255,255,255,0.08);
    border-radius: 2px;
    overflow: hidden;
  }
  .ld-bar {
    height: 100%;
    background: #e8d5b0;
    width: 0%;
    border-radius: 2px;
    transition: width 0.4s ease;
  }
  .ld-msg {
    font-size: 10px;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: #444;
    text-align: center;
    max-width: 260px;
    line-height: 1.8;
  }
  .ld-error {
    color: #ff6b6b;
    font-size: 12px;
    text-align: center;
    max-width: 300px;
    line-height: 1.7;
    display: none;
  }
  .ld-retry {
    background: #e8d5b0;
    color: #000;
    border: none;
    border-radius: 20px;
    padding: 10px 28px;
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 1px;
    cursor: pointer;
    display: none;
    margin-top: 4px;
  }

  /* ── Top bar ── */
  #top-bar {
    position: fixed;
    top: 0; left: 0; right: 0;
    z-index: 100;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 14px 16px;
    background: linear-gradient(to bottom, rgba(0,0,0,0.7) 0%, transparent 100%);
    pointer-events: none;
  }

  #back-btn {
    pointer-events: all;
    background: rgba(0,0,0,0.55);
    color: #e8d5b0;
    font-size: 10px;
    letter-spacing: 2px;
    text-transform: uppercase;
    padding: 7px 14px;
    border-radius: 20px;
    text-decoration: none;
    border: 1px solid rgba(232,213,176,0.2);
  }

  #status-pill {
    background: rgba(0,0,0,0.55);
    border: 1px solid rgba(255,255,255,0.1);
    color: #555;
    font-size: 10px;
    letter-spacing: 2px;
    text-transform: uppercase;
    padding: 7px 12px;
    border-radius: 20px;
    transition: all 0.3s;
  }
  #status-pill.on  { color: #4fffb0; border-color: rgba(79,255,176,0.3); }
  #status-pill.off { color: #ff6b6b; border-color: rgba(255,107,107,0.3); }
  #status-pill.warn{ color: #ffcc44; border-color: rgba(255,204,68,0.3); }

  /* ── Bottom hint ── */
  #hint {
    position: fixed;
    bottom: 36px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 100;
    background: rgba(0,0,0,0.55);
    border: 1px solid rgba(255,255,255,0.08);
    color: rgba(255,255,255,0.4);
    font-size: 10px;
    letter-spacing: 2px;
    text-transform: uppercase;
    padding: 8px 18px;
    border-radius: 20px;
    white-space: nowrap;
    transition: opacity 0.5s;
  }
  #hint.hidden { opacity: 0; pointer-events: none; }

  /* ── Effect-not-loaded notice ── */
  #effect-notice {
    position: fixed;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    z-index: 90;
    text-align: center;
    pointer-events: none;
    opacity: 0;
    transition: opacity 0.4s;
  }
  #effect-notice.show { opacity: 1; }
  .en-icon  { font-size: 52px; margin-bottom: 10px; }
  .en-text  {
    color: rgba(255,255,255,0.35);
    font-size: 11px;
    letter-spacing: 2px;
    text-transform: uppercase;
    line-height: 2;
  }
</style>
</head>
<body>

<!-- Loader -->
<div id="loader">
  <div class="ld-logo">👟</div>
  <div class="ld-title">Shoe Try-On</div>
  <div class="ld-bar-wrap"><div class="ld-bar" id="ld-bar"></div></div>
  <div class="ld-msg" id="ld-msg">Initialising…</div>
  <div class="ld-error" id="ld-error"></div>
  <button class="ld-retry" id="ld-retry" onclick="location.reload()">↺ Retry</button>
</div>

<!-- AR -->
<div id="ar-container">
  <canvas id="deepar-canvas"></canvas>

  <div id="effect-notice">
    <div class="en-icon">🦶</div>
    <div class="en-text">No effect loaded<br>Add your .deepar file to see the shoe</div>
  </div>
</div>

<!-- Top bar -->
<div id="top-bar">
  <a href="index.html" id="back-btn">← AR</a>
  <div id="status-pill" class="warn">Starting…</div>
</div>

<!-- Bottom hint -->
<div id="hint" class="hidden">Point camera at your feet</div>

<!--
  ═══════════════════════════════════════════════════
  DeepAR Web SDK
  Replace YOUR_DEEPAR_KEY with your real licence key.
  SDK docs: https://docs.deepar.ai/deepar-sdk/web
  ═══════════════════════════════════════════════════
-->
<script src="https://cdn.jsdelivr.net/npm/deepar/js/deepar.js"></script>

<script>
// ─────────────────────────────────────────────────────────────
//  CONFIG — edit these to match your setup
// ─────────────────────────────────────────────────────────────
const CONFIG = {
  licenceKey:  'a82708247ab81914fec0ea1f57b91f2c5fc7278abd877a904721b2d20bab576577237517883ef9fe',   // ← paste your DeepAR licence key here

  // Path to your .deepar effect file for shoe try-on.
  // Instructions to create one (free):
  //   1. Go to https://effects.deepar.ai
  //   2. Create a new project → choose "Body Tracking"
  //   3. Import shoe.glb → attach to Left Foot + Right Foot bones
  //   4. Export → save the .deepar file next to this HTML
  //   5. Replace the path below with your filename, e.g. 'shoe_effect.deepar'
  effectPath:  'shoe.deepar',       // Generated DeepAR shoe try-on effect

  // Your shoe GLB — used as a fallback Three.js preview when no effect is loaded
  // (DeepAR handles the real tracking; this is just so you can see something)
  modelPath:   'shoe.glb',

  // Camera
  facingMode:  'environment',       // 'environment' = rear cam, 'user' = front cam
};
// ─────────────────────────────────────────────────────────────

const ldBar       = document.getElementById('ld-bar');
const ldMsg       = document.getElementById('ld-msg');
const ldError     = document.getElementById('ld-error');
const ldRetry     = document.getElementById('ld-retry');
const loader      = document.getElementById('loader');
const statusPill  = document.getElementById('status-pill');
const hint        = document.getElementById('hint');
const effectNote  = document.getElementById('effect-notice');

function setProgress(pct, msg) {
  ldBar.style.width = pct + '%';
  if (msg) ldMsg.textContent = msg;
}

function showError(msg) {
  ldError.textContent = msg;
  ldError.style.display = 'block';
  ldRetry.style.display = 'block';
  ldMsg.style.display = 'none';
  ldBar.style.width = '100%';
  ldBar.style.background = '#ff6b6b';
}

function setStatus(text, cls) {
  statusPill.textContent = text;
  statusPill.className = cls || '';
}

function errorText(err) {
  if (!err) return 'Unknown error';
  return err.message || err.name || String(err);
}

async function checkEffectFile(path) {
  const res = await fetch(path + '?v=' + Date.now(), { cache: 'no-store' });
  if (!res.ok) throw new Error(path + ' not found. HTTP ' + res.status);
}

function withTimeout(promise, ms, label) {
  return Promise.race([
    promise,
    new Promise((_, reject) => setTimeout(() => reject(new Error(label + ' timeout')), ms))
  ]);
}

async function init() {
  try {
    // ── 1. Init DeepAR ────────────────────────────────────────
    // Do NOT pre-open/stop the camera here. On some Android phones it locks
    // the camera and DeepAR then throws: "Could not start video source".
    // Let DeepAR request and manage the camera directly.
    const canvas = document.getElementById('deepar-canvas');

    // Resize canvas to window
    function resizeCanvas() {
      canvas.width  = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    resizeCanvas();
    window.addEventListener('resize', resizeCanvas);

    // ── Request camera FIRST to avoid "Could not start video source" ──
    setProgress(15, 'Requesting camera…');
    let stream = null;
    try {
      stream = await navigator.mediaDevices.getUserMedia({
        video: { facingMode: { ideal: CONFIG.facingMode }, width: { ideal: 1280 }, height: { ideal: 720 } },
        audio: false
      });
    } catch (camErr) {
      throw new Error('Camera access denied. Please allow camera and reload. (' + camErr.message + ')');
    }

    setProgress(30, 'Starting DeepAR…');

    // Feed the stream into a hidden video element
    // then pass that video to DeepAR — avoids double camera-open bug on Android
    const video = document.createElement('video');
    video.srcObject = stream;
    video.setAttribute('playsinline', '');
    video.muted = true;
    video.style.cssText = 'position:fixed;width:1px;height:1px;opacity:0;pointer-events:none;';
    document.body.appendChild(video);
    await video.play().catch(() => {});

    const deepAR = await deepar.initialize({
      licenceKey:   CONFIG.licenceKey,
      canvas:       canvas,
      videoElement: video,
    });

    setProgress(70, 'Loading effect…');

    // ── 2. Load shoe effect ───────────────────────────────────
    if (CONFIG.effectPath) {
      try {
        setProgress(75, 'Checking shoe effect…');
        await checkEffectFile(CONFIG.effectPath);
        setProgress(85, 'Loading shoe effect…');
        await withTimeout(deepAR.switchEffect(CONFIG.effectPath), 45000, 'Effect loading');
        setStatus('Tracking feet', 'on');
        effectNote.classList.remove('show');

        // Listen for body tracking events if available
        if (typeof deepAR.on === 'function') {
          deepAR.on('bodyTrackingStarted', () => {
            setStatus('Feet detected ✓', 'on');
            hint.classList.add('hidden');
          });
          deepAR.on('bodyTrackingStopped', () => {
            setStatus('Point at feet', 'warn');
            hint.classList.remove('hidden');
          });
        }

      } catch (e) {
        console.warn('Effect load failed:', e);
        const msg = '❌ Effect load failed. ' + errorText(e);
        setStatus('Effect error', 'off');
        effectNote.classList.add('show');
        showError(msg);
        alert(msg);
        return;
      }
    } else {
      // No effect file yet — show placeholder notice
      setStatus('No effect loaded', 'warn');
      effectNote.classList.add('show');
      hint.classList.remove('hidden');
      hint.textContent = 'Add your .deepar effect file to see the shoe';
    }

    setProgress(100, 'Ready!');

    // ── 4. Hide loader ────────────────────────────────────────
    setTimeout(() => {
      loader.classList.add('hidden');
      setTimeout(() => { loader.style.display = 'none'; }, 600);
    }, 300);

  } catch (err) {
    console.error('DeepAR init error:', err);

    // Friendly error messages
    let msg = err.message || String(err);
    if (msg.includes('licence') || msg.includes('license') || msg.includes('key')) {
      msg = '❌ Invalid licence key.\nReplace YOUR_DEEPAR_KEY in the CONFIG section with your real DeepAR key from deepar.ai/dashboard';
    } else if (msg.includes('camera') || msg.includes('NotAllowed') || msg.includes('Permission')) {
      msg = '❌ Camera permission denied.\nPlease allow camera access and reload.';
    } else if (msg.includes('WebGL') || msg.includes('webgl')) {
      msg = '❌ WebGL not supported on this device/browser.';
    } else {
      msg = '❌ ' + msg;
    }

    showError(msg);
    alert(msg);
  }
}

// Kick off
init();
</script>

<!--
═══════════════════════════════════════════════════════════════
  SETUP GUIDE
═══════════════════════════════════════════════════════════════

  STEP 1 — Get your DeepAR licence key
    → https://deepar.ai/dashboard
    → Create a project, copy the Web SDK key
    → Paste it into CONFIG.licenceKey above

  STEP 2 — Create your shoe .deepar effect (FREE)
    → Go to https://effects.deepar.ai
    → New project → select "Body Tracking" template
    → Import shoe.glb
    → In the scene, attach the shoe mesh to:
        Left Foot bone  (for left shoe)
        Right Foot bone (for right shoe)
    → Adjust scale/position to fit
    → Export → save as e.g. shoe_effect.deepar
    → Put it in the same folder as this HTML file
    → Set CONFIG.effectPath = 'shoe_effect.deepar'

  STEP 3 — Serve locally (required — file:// won't work)
    → npx serve .
    → or: python3 -m http.server 8080
    → Open http://localhost:8080/tryon-deepar.html

  STEP 4 — On mobile
    → Make sure your phone and PC are on the same network
    → Open http://YOUR_PC_IP:8080/tryon-deepar.html on your phone
    → Allow camera when prompted

  DeepAR docs: https://docs.deepar.ai/deepar-sdk/web
═══════════════════════════════════════════════════════════════
-->

</body>
</html>
