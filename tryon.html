<!DOCTYPE html>
<html lang="en">
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Shoe Try-On</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #000; font-family: 'Segoe UI', sans-serif; overflow: hidden; height: 100dvh; }

    #deepar-canvas {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100dvh;
      object-fit: cover;
    }

    /* Loader */
    #loader {
      position: fixed; inset: 0; background: #0a0a0a; z-index: 999;
      display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px;
      transition: opacity .5s;
    }
    #loader.hidden { opacity: 0; pointer-events: none; }
    .ld-logo  { font-size: 44px; }
    .ld-title { color: #e8d5b0; font-size: 14px; letter-spacing: 6px; font-weight: 700; text-transform: uppercase; }
    .ld-bar-wrap { width: 220px; height: 2px; background: rgba(255,255,255,0.08); border-radius: 2px; overflow: hidden; }
    .ld-bar  { height: 100%; background: #e8d5b0; width: 0%; border-radius: 2px; transition: width .4s; }
    .ld-msg  { font-size: 10px; letter-spacing: 2px; text-transform: uppercase; color: #666; text-align: center; }
    .ld-retry { background: #e8d5b0; color: #000; border: none; border-radius: 20px; padding: 10px 28px; font-size: 12px; font-weight: 700; cursor: pointer; display: none; margin-top: 4px; }

    /* UI */
    #back-btn { position: fixed; top: 16px; left: 16px; z-index: 200; background: rgba(0,0,0,.6); color: #e8d5b0; font-size: 10px; letter-spacing: 2px; text-transform: uppercase; padding: 8px 14px; border-radius: 20px; text-decoration: none; border: 1px solid rgba(232,213,176,.2); }
    #hint { position: fixed; bottom: 100px; left: 50%; transform: translateX(-50%); z-index: 200; background: rgba(0,0,0,.55); border: 1px solid rgba(255,255,255,.08); color: rgba(255,255,255,.6); font-size: 10px; letter-spacing: 2px; text-transform: uppercase; padding: 9px 20px; border-radius: 20px; white-space: nowrap; pointer-events: none; }
    #hint.hidden { display: none; }

    /* Screenshot button */
    #fab { position: fixed; bottom: 32px; right: 20px; z-index: 200; width: 52px; height: 52px; border-radius: 50%; background: rgba(232,213,176,0.15); border: 1px solid rgba(232,213,176,.35); color: #e8d5b0; font-size: 22px; display: flex; align-items: center; justify-content: center; cursor: pointer; transition: transform .15s, background .15s; }
    #fab:active { transform: scale(.92); background: rgba(232,213,176,.28); }

    /* Flash */
    #flash { position: fixed; inset: 0; background: #fff; z-index: 500; opacity: 0; pointer-events: none; transition: opacity .1s; }
    #flash.on { opacity: 0.7; }
  </style>
</head>
<body>

<div id="loader">
  <div class="ld-logo">👟</div>
  <div class="ld-title">Shoe Try-On</div>
  <div class="ld-bar-wrap"><div class="ld-bar" id="ld-bar"></div></div>
  <div class="ld-msg" id="ld-msg">Starting…</div>
  <button class="ld-retry" id="ld-retry" onclick="location.reload()">↺ Retry</button>
</div>

<canvas id="deepar-canvas"></canvas>

<div id="flash"></div>
<a href="index.html" id="back-btn">← Back</a>
<div id="hint">Point camera at your feet</div>
<div id="fab" onclick="snap()">📸</div>

<!-- DeepAR SDK -->
<script src="https://cdn.jsdelivr.net/npm/deepar@5.6.6/js/deepar.js"></script>

<script>
  // ============================================================
  //  PASTE YOUR DEEPAR API KEY BELOW
  // ============================================================
  const DEEPAR_API_KEY = '0025c1062ae79f4fa9a689f055e27b1a9cf770ed1585b3b2177e34895ccd348a757811214b0eae99';
  // ============================================================

  const ldBar  = document.getElementById('ld-bar');
  const ldMsg  = document.getElementById('ld-msg');
  const loader = document.getElementById('loader');
  const hint   = document.getElementById('hint');

  async function boot() {
    try {
      ldMsg.textContent = 'Loading DeepAR…';
      ldBar.style.width = '20%';

      const deepAR = await deepar.initialize({
        licenseKey: DEEPAR_API_KEY,
        canvas: document.getElementById('deepar-canvas'),
        additionalOptions: {
          cameraConfig: {
            facingMode: 'environment', // rear camera for feet
          }
        }
      });

      ldMsg.textContent = 'Loading shoe effect…';
      ldBar.style.width = '60%';

      await deepAR.switchEffect('shoe.deepar');

      ldBar.style.width = '100%';
      ldMsg.textContent = 'Ready!';
      setTimeout(() => {
        loader.classList.add('hidden');
        setTimeout(() => hint.classList.add('hidden'), 4000);
      }, 500);

    } catch (err) {
      console.error(err);
      ldMsg.style.color = '#ff6b6b';
      ldMsg.textContent = '❌ ' + err.message;
      document.getElementById('ld-retry').style.display = 'block';
    }
  }

  function snap() {
    const flash = document.getElementById('flash');
    flash.classList.add('on');
    setTimeout(() => flash.classList.remove('on'), 200);
    const canvas = document.getElementById('deepar-canvas');
    const a = document.createElement('a');
    a.href = canvas.toDataURL('image/png');
    a.download = 'shoe-tryon-' + Date.now() + '.png';
    a.click();
  }

  boot();
</script>
</body>
</html>
